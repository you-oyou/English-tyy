<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--bg:#120d12;--panel:#211720;--panel2:#2b1e28;--cream:#f4e7c5;--gold:#e8b84b;--red:#d64b43;--cyan:#6fd5c8;--muted:#9f8f8c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,"Times New Roman",serif;background:radial-gradient(circle at 50% 0%,#3a2334 0,#181018 42%,#0e0a0e 100%);color:var(--cream)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background:repeating-linear-gradient(0deg,transparent 0 3px,#fff 4px 5px)}
a{color:inherit;text-decoration:none}.wrap{width:min(1120px,92vw);margin:auto}.header{text-align:center;padding:34px 0 18px}.kicker{letter-spacing:5px;color:var(--gold);font:700 13px Arial,sans-serif}
h1{margin:8px 0;font-size:clamp(38px,7vw,76px);line-height:.95;text-transform:uppercase;text-shadow:4px 4px 0 #5a2d42}.subtitle{color:#cdb9a8;margin:14px 0 0;font:14px Arial,sans-serif;letter-spacing:2px}
.panel{background:linear-gradient(145deg,var(--panel2),var(--panel));border:3px solid var(--gold);box-shadow:0 8px 0 #09070a,0 14px 30px rgba(0,0,0,.45);padding:28px;border-radius:8px;position:relative}
.panel:after{content:"";position:absolute;inset:8px;border:1px solid rgba(244,231,197,.18);pointer-events:none}
.btn{display:inline-block;border:3px solid var(--gold);background:#3b222f;color:var(--cream);padding:14px 26px;font:800 15px Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;cursor:pointer;box-shadow:0 5px 0 #8b5a22;transition:.12s transform,.12s filter}
.btn:hover{filter:brightness(1.15)}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #8b5a22}.btn.alt{border-color:var(--cyan);box-shadow:0 5px 0 #397a73}
.center{text-align:center}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{padding:24px;background:#1b131b;border:2px solid #75565e;border-radius:6px;box-shadow:0 5px 0 #09070a}.card h2{color:var(--gold);margin-top:0}.card p{color:#cdb9a8;line-height:1.7}.badge{display:inline-block;border:1px solid var(--red);color:#ffaaa3;padding:4px 8px;font:11px Arial,sans-serif;letter-spacing:2px}
footer{text-align:center;color:#806d6b;font:12px Arial,sans-serif;padding:30px 0}@media(max-width:760px){.grid{grid-template-columns:1fr}.panel{padding:18px}}

.game{max-width:1050px;margin:20px auto}.hud{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}.stats{display:flex;gap:18px;flex-wrap:wrap;font:700 15px Arial}.stats b{color:var(--cyan)}.arena{height:540px;margin:18px 0;background:#0b090d;border:3px solid #70525b;position:relative;overflow:hidden}.faller{position:absolute;top:-80px;width:66px;height:66px;border:4px solid var(--gold);background:#432337;display:grid;place-items:center;color:var(--cream);font:900 28px Arial;box-shadow:0 6px 0 #09070a;border-radius:50%}.ground{position:absolute;bottom:48px;left:0;right:0;border-top:3px solid var(--red)}.stage{display:flex;gap:6px;justify-content:center;margin:12px}.flower{font-size:28px;opacity:.25}.flower.on{opacity:1}.over{position:absolute;inset:0;background:rgba(10,7,10,.86);display:none;place-items:center;text-align:center;padding:30px;z-index:3}.over.show{display:grid}.big{font:900 clamp(60px,12vw,130px) Arial;color:var(--gold);text-shadow:6px 6px 0 #6d2e47}.controls{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center}.controls label{font:13px Arial;color:#cdb9a8}
</style></head><body><header class="header wrap"><div class="kicker">RETRO TYPING ARCADE · LEVEL 05</div><h1>FLOWER RUSH</h1><div class="subtitle">STAGE CLEAR · RETRO CHALLENGE</div></header><main class="wrap game panel"><div class="hud"><span class="badge">VERSION 05 · 5 STAGES</span><div class="stats"><span>SCORE <b id="score">0</b></span><span>STAGE <b id="stage">1</b>/5</span><span>MISS <b id="miss">0</b></span></div></div><div class="stage" id="flowers"><span class="flower">✿</span><span class="flower">✿</span><span class="flower">✿</span><span class="flower">✿</span><span class="flower">✿</span></div><div class="arena" id="arena"><div class="ground"></div><div class="over show" id="over"><div><div class="big" id="overTitle">READY</div><p id="overText">完成每階段後獲得一朵花</p><button class="btn" id="overBtn">開始挑戰</button></div></div></div><div class="controls"><label>基礎速度 <b id="sec">7</b> 秒<input id="speed" type="range" min="3" max="12" value="7"></label><button class="btn alt" id="pause">暫停</button><a class="btn" href="../index.html">回入口</a></div><p style="text-align:center;color:#b9a6a1;font:13px Arial">按對消除字母 · 每階段 5 題 · 每過一關點亮一朵花 · 離開視窗自動暫停</p></main><footer>VERSION 05 · EXTRA EXTENSION BEYOND THE TEACHING HANDOUT</footer>
<script>
const letters=['A','S','D','F','G','H','J','K','L',';'];const arena=document.getElementById('arena'),scoreEl=document.getElementById('score'),stageEl=document.getElementById('stage'),missEl=document.getElementById('miss'),flowers=[...document.querySelectorAll('.flower')],speed=document.getElementById('speed'),sec=document.getElementById('sec'),over=document.getElementById('over'),overTitle=document.getElementById('overTitle'),overText=document.getElementById('overText'),overBtn=document.getElementById('overBtn');let score=0,miss=0,stage=1,q=0,current=null,timer=null,running=false,paused=false;
speed.oninput=()=>sec.textContent=speed.value;function clearFaller(){if(current){current.remove();current=null}if(timer){clearTimeout(timer);timer=null}}function spawn(){clearFaller();if(q>=5){flowers[stage-1].classList.add('on');if(stage>=5)return end();stage++;q=0;stageEl.textContent=stage;showStage();return}q++;const ch=letters[Math.floor(Math.random()*letters.length)],d=document.createElement('div');d.className='faller';d.textContent=ch;d.style.left=(7+Math.random()*84)+'%';arena.appendChild(d);current=d;const seconds=Math.max(3,Number(speed.value)-(stage-1));d.style.transition='top '+seconds+'s linear';requestAnimationFrame(()=>d.style.top='calc(100% + 10px)');timer=setTimeout(()=>{if(!current)return;miss++;missEl.textContent=miss;current.remove();current=null;spawn()},seconds*1000)}
function showStage(){overTitle.textContent='STAGE '+stage;overText.textContent='準備好，下一關速度更快！';overBtn.textContent='繼續';over.classList.add('show');running=false}function start(){score=0;miss=0;stage=1;q=0;flowers.forEach(f=>f.classList.remove('on'));scoreEl.textContent=0;missEl.textContent=0;stageEl.textContent=1;over.classList.remove('show');running=true;paused=false;spawn()}function end(){running=false;overTitle.textContent='ALL CLEAR!';overText.textContent='總分 '+score+'｜MISS '+miss+'｜五朵花全部收集完成！';overBtn.textContent='再玩一次';over.classList.add('show')}function pause(){if(!running)return;paused=true;running=false;clearFaller();overTitle.textContent='PAUSED';overText.textContent='按繼續回到目前關卡';overBtn.textContent='繼續';over.classList.add('show')}overBtn.onclick=()=>{if(overTitle.textContent==='READY'||overTitle.textContent==='ALL CLEAR!')start();else{over.classList.remove('show');paused=false;running=true;spawn()}};document.getElementById('pause').onclick=pause;window.addEventListener('keydown',e=>{if(!running||e.repeat||!current)return;const k=e.key.length===1?e.key.toUpperCase():e.key;if(k===current.textContent){score++;scoreEl.textContent=score;clearFaller();spawn()}});window.addEventListener('blur',()=>{if(running)pause()});
</script></body></html>
