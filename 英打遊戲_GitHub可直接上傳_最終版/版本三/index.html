<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--bg:#120d12;--panel:#211720;--panel2:#2b1e28;--cream:#f4e7c5;--gold:#e8b84b;--red:#d64b43;--cyan:#6fd5c8;--muted:#9f8f8c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,"Times New Roman",serif;background:radial-gradient(circle at 50% 0%,#3a2334 0,#181018 42%,#0e0a0e 100%);color:var(--cream)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background:repeating-linear-gradient(0deg,transparent 0 3px,#fff 4px 5px)}
a{color:inherit;text-decoration:none}.wrap{width:min(1120px,92vw);margin:auto}.header{text-align:center;padding:34px 0 18px}.kicker{letter-spacing:5px;color:var(--gold);font:700 13px Arial,sans-serif}
h1{margin:8px 0;font-size:clamp(38px,7vw,76px);line-height:.95;text-transform:uppercase;text-shadow:4px 4px 0 #5a2d42}.subtitle{color:#cdb9a8;margin:14px 0 0;font:14px Arial,sans-serif;letter-spacing:2px}
.panel{background:linear-gradient(145deg,var(--panel2),var(--panel));border:3px solid var(--gold);box-shadow:0 8px 0 #09070a,0 14px 30px rgba(0,0,0,.45);padding:28px;border-radius:8px;position:relative}
.panel:after{content:"";position:absolute;inset:8px;border:1px solid rgba(244,231,197,.18);pointer-events:none}
.btn{display:inline-block;border:3px solid var(--gold);background:#3b222f;color:var(--cream);padding:14px 26px;font:800 15px Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;cursor:pointer;box-shadow:0 5px 0 #8b5a22;transition:.12s transform,.12s filter}
.btn:hover{filter:brightness(1.15)}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #8b5a22}.btn.alt{border-color:var(--cyan);box-shadow:0 5px 0 #397a73}
.center{text-align:center}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{padding:24px;background:#1b131b;border:2px solid #75565e;border-radius:6px;box-shadow:0 5px 0 #09070a}.card h2{color:var(--gold);margin-top:0}.card p{color:#cdb9a8;line-height:1.7}.badge{display:inline-block;border:1px solid var(--red);color:#ffaaa3;padding:4px 8px;font:11px Arial,sans-serif;letter-spacing:2px}
footer{text-align:center;color:#806d6b;font:12px Arial,sans-serif;padding:30px 0}@media(max-width:760px){.grid{grid-template-columns:1fr}.panel{padding:18px}}

.game{max-width:900px;margin:24px auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.score{font:900 22px Arial;color:var(--cyan)}.target{font:900 clamp(70px,14vw,150px) Arial;color:var(--gold);text-shadow:5px 5px 0 #6d2e47;text-align:center;margin:25px 0}.keyboard{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:650px;margin:20px auto}.key{background:#d8c7a4;color:#211923;border:4px solid #8b6f47;border-radius:7px;padding:22px 10px;text-align:center;font:bold 28px Arial;box-shadow:0 6px 0 #6e4932}.key.active{background:var(--red);color:white;transform:translateY(5px);box-shadow:0 1px 0 #6e4932}.help{text-align:center;color:#b9a6a1;font:13px Arial,sans-serif}
</style></head><body><header class="header wrap"><div class="kicker">RETRO TYPING ARCADE · LEVEL 03</div><h1>ASDF ATTACK</h1><div class="subtitle">LEFT HAND TRAINING</div></header><main class="wrap game panel"><div class="top"><span class="badge">VERSION 03</span><div class="score">SCORE <span id="score">0</span></div></div><div class="target" id="target">—</div><div class="keyboard" id="keyboard"></div><p class="help" id="help">按「開始」後，用實體鍵盤輸入 A / S / D / F</p><div class="center" style="margin-top:20px"><button class="btn" id="start">開始</button><button class="btn alt" id="stop">停止</button><a class="btn" href="../index.html">回入口</a></div></main><footer>按錯不扣分 · 長按不連續計分</footer>
<script>
const keys=['A','S','D','F'];let target='',score=0,running=false;const targetEl=document.getElementById('target'),scoreEl=document.getElementById('score'),kb=document.getElementById('keyboard'),help=document.getElementById('help');keys.forEach(k=>{const d=document.createElement('div');d.className='key';d.id='key-'+k;d.textContent=k;kb.appendChild(d)});function next(){target=keys[Math.floor(Math.random()*keys.length)];targetEl.textContent=target;keys.forEach(k=>document.getElementById('key-'+k).classList.toggle('active',k===target))}function start(){score=0;scoreEl.textContent=score;running=true;help.textContent='請按亮起的按鍵';next()}function stop(){running=false;target='';targetEl.textContent='—';keys.forEach(k=>document.getElementById('key-'+k).classList.remove('active'));help.textContent='已停止練習'}document.getElementById('start').onclick=start;document.getElementById('stop').onclick=stop;window.addEventListener('keydown',e=>{if(!running||e.repeat)return;const k=e.key.toUpperCase();if(!keys.includes(k))return;if(k===target){score++;scoreEl.textContent=score;next()}});
</script></body></html>
