<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--bg:#120d12;--panel:#211720;--panel2:#2b1e28;--cream:#f4e7c5;--gold:#e8b84b;--red:#d64b43;--cyan:#6fd5c8;--muted:#9f8f8c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,"Times New Roman",serif;background:radial-gradient(circle at 50% 0%,#3a2334 0,#181018 42%,#0e0a0e 100%);color:var(--cream)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background:repeating-linear-gradient(0deg,transparent 0 3px,#fff 4px 5px)}
a{color:inherit;text-decoration:none}.wrap{width:min(1120px,92vw);margin:auto}.header{text-align:center;padding:34px 0 18px}.kicker{letter-spacing:5px;color:var(--gold);font:700 13px Arial,sans-serif}
h1{margin:8px 0;font-size:clamp(38px,7vw,76px);line-height:.95;text-transform:uppercase;text-shadow:4px 4px 0 #5a2d42}.subtitle{color:#cdb9a8;margin:14px 0 0;font:14px Arial,sans-serif;letter-spacing:2px}
.panel{background:linear-gradient(145deg,var(--panel2),var(--panel));border:3px solid var(--gold);box-shadow:0 8px 0 #09070a,0 14px 30px rgba(0,0,0,.45);padding:28px;border-radius:8px;position:relative}
.panel:after{content:"";position:absolute;inset:8px;border:1px solid rgba(244,231,197,.18);pointer-events:none}
.btn{display:inline-block;border:3px solid var(--gold);background:#3b222f;color:var(--cream);padding:14px 26px;font:800 15px Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;cursor:pointer;box-shadow:0 5px 0 #8b5a22;transition:.12s transform,.12s filter}
.btn:hover{filter:brightness(1.15)}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #8b5a22}.btn.alt{border-color:var(--cyan);box-shadow:0 5px 0 #397a73}
.center{text-align:center}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{padding:24px;background:#1b131b;border:2px solid #75565e;border-radius:6px;box-shadow:0 5px 0 #09070a}.card h2{color:var(--gold);margin-top:0}.card p{color:#cdb9a8;line-height:1.7}.badge{display:inline-block;border:1px solid var(--red);color:#ffaaa3;padding:4px 8px;font:11px Arial,sans-serif;letter-spacing:2px}
footer{text-align:center;color:#806d6b;font:12px Arial,sans-serif;padding:30px 0}@media(max-width:760px){.grid{grid-template-columns:1fr}.panel{padding:18px}}

.game{max-width:1000px;margin:20px auto}.hud{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;align-items:center}.score{font:900 22px Arial;color:var(--cyan)}.arena{height:520px;margin:18px 0;background:#0b090d;border:3px solid #70525b;position:relative;overflow:hidden}.lane-line{position:absolute;bottom:55px;left:0;right:0;border-top:2px dashed #6d454d}.faller{position:absolute;top:-75px;width:64px;height:64px;border:4px solid var(--gold);background:#3a2030;display:grid;place-items:center;color:var(--cream);font:900 28px Arial;box-shadow:0 6px 0 #09070a;border-radius:6px}.controls{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}.controls label{font:13px Arial;color:#cdb9a8}.result{display:none;text-align:center;padding:25px}.result.show{display:block}
</style></head><body><header class="header wrap"><div class="kicker">RETRO TYPING ARCADE · LEVEL 04</div><h1>DROP LETTERS</h1><div class="subtitle">TEN-KEY FALLING TRAINING</div></header><main class="wrap game panel"><div class="hud"><span class="badge">VERSION 04 · 10 ROUNDS</span><div class="score">SCORE <span id="score">0</span> / <span id="round">0</span></div></div><div class="arena" id="arena"><div class="lane-line"></div></div><div class="controls"><div><label>每個字母落地時間：<b id="sec">8</b> 秒</label><input id="speed" type="range" min="3" max="14" value="8"></div><label><input id="accel" type="checkbox"> 漸進加速</label></div><div class="center" style="margin-top:20px"><button class="btn" id="start">開始</button><button class="btn alt" id="pause">暫停</button><a class="btn" href="../index.html">回入口</a></div><div class="result" id="result"><h2>ROUND CLEAR!</h2><p id="resultText"></p><button class="btn" id="again">再玩一次</button></div><p style="text-align:center;color:#b9a6a1;font:13px Arial">A S D F G H J K L ;　｜　按錯不消除，落地記錄一次</p></main><footer>英文輸入法 · 長按不連續計分 · 離開視窗自動暫停</footer>
<script>
const letters=['A','S','D','F','G','H','J','K','L',';'];const arena=document.getElementById('arena'),scoreEl=document.getElementById('score'),roundEl=document.getElementById('round'),speed=document.getElementById('speed'),sec=document.getElementById('sec'),accel=document.getElementById('accel'),result=document.getElementById('result');let score=0,round=0,current=null,timer=null,running=false,paused=false;
speed.oninput=()=>{sec.textContent=speed.value;if(running)pauseGame()};function clearFaller(){if(current){current.remove();current=null}if(timer){clearTimeout(timer);timer=null}}function spawn(){clearFaller();if(round>=10)return finish();round++;roundEl.textContent=round;const ch=letters[Math.floor(Math.random()*letters.length)],d=document.createElement('div');d.className='faller';d.textContent=ch;d.style.left=(8+Math.random()*82)+'%';arena.appendChild(d);current=d;const seconds=Math.max(3,Number(speed.value)-(accel.checked?Math.floor(score/3):0));d.style.transition='top '+seconds+'s linear';requestAnimationFrame(()=>d.style.top='calc(100% + 10px)');timer=setTimeout(()=>{if(!current)return;current=null;d.remove();spawn()},seconds*1000)}
function startGame(){score=0;round=0;running=true;paused=false;scoreEl.textContent=0;roundEl.textContent=0;result.classList.remove('show');spawn()}function pauseGame(){if(!running)return;paused=true;running=false;clearFaller()}function resumeGame(){if(!paused)return;paused=false;running=true;spawn()}function finish(){running=false;paused=false;clearFaller();result.classList.add('show');document.getElementById('resultText').textContent='10 題完成，你得到 '+score+' 分。'}document.getElementById('start').onclick=startGame;document.getElementById('again').onclick=startGame;document.getElementById('pause').onclick=()=>paused?resumeGame():pauseGame();window.addEventListener('keydown',e=>{if(!running||e.repeat||!current)return;const k=e.key.length===1?e.key.toUpperCase():e.key;if(k===current.textContent){score++;scoreEl.textContent=score;clearFaller();spawn()}});window.addEventListener('blur',()=>{if(running)pauseGame()});
</script></body></html>
